  <path d="M26 50 C26 40, 34 34, 42 38 L64 48 C70 51, 70 59, 64 62 L42 72 C34 76, 26 70, 26 50 Z" fill="url(#grad)"/>
  <circle cx="50" cy="50" r="8" fill="#ffffff" opacity="0.9"/>
